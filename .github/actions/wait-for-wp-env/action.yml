name: Wait for wp-env
description: Block until a backgrounded wp-env boot has finished and the site is responding

inputs:
  url:
    description: The URL to poll
    default: http://localhost:9784
  timeout:
    description: How many seconds to wait before giving up
    default: "300"

runs:
  using: composite
  steps:
    - name: Wait for wp-env
      shell: bash
      env:
        URL: ${{ inputs.url }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        deadline=$(( SECONDS + TIMEOUT ))

        fail() {
          echo "::error::$1"
          cat wp-env.log
          exit 1
        }

        # The site already responds while wp-env is still configuring it,
        # so wait for wp-env to exit instead of polling the URL
        while kill -0 "$(cat wp-env.pid)" 2>/dev/null; do
          (( SECONDS < deadline )) || fail "Timed out waiting for wp-env"
          sleep 2
        done

        curl -sfo /dev/null "$URL" || fail "wp-env exited, but $URL is not up"

        echo "wp-env is up at $URL"
        cat wp-env.log
